        <button id = "sayColor">Hello</button>
        <script>
            let button = document.getElementById("sayColor");
            if(!localStorage.getItem("color") || localStorage.getItem("hasReset") ==="true")
            {
                localStorage.removeItem("color");
                localStorage.setItem("hasReset", "false")
                let roll = Math.trunc((Math.random() * 3));
                localStorage.setItem("color", roll);
            }
            switch(parseInt(localStorage.getItem("color")))
            {
                case 0:
                    button.style.setProperty("background-color", "red", "important");
                    break;
                case 1:
                    button.style.setProperty("background-color", "blue", "important");
                    button.style.setProperty("color", "white", "important");
                    break;
                default:
                    button.style.setProperty("background-color", "green", "important");
                    button.style.setProperty("color", "white", "important");
                    break;
            }
        </script>
