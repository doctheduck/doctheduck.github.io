        <button id = "runner"> Click Me!</button>
        <script>
        const button = document.getElementById("runner");
        let taunts = ["too slow", "try hitting me", "close"];
        function moveButton()
        {
            const maxX = window.innerWidth - button.offsetWidth;
            const maxY = window.innerHeight - button.offsetHeight;

            const x = Math.random() * maxX;
            const y = Math.random() * maxY;
            let thing = Math.floor(x %3);
            button.innerText = taunts[thing];

            button.style.left = `${x}px`;
            button.style.top = `${y}px`;
        }
        setInterval(moveButton, 700);
        moveButton();

        button.addEventListener("click", function()
        {
            let track = parseInt(localStorage.getItem("gameState"));
            localStorage.setItem("gameState", track + 1)
        });
    </script>
