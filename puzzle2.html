        <h1><p id = "thing">Easy trick, right?</p></h1>
        <input type = "text" id = "textBox"  name = "sorry, no hints here">
        <button id = "checkAnswer">Check Answer</button>
        <script src="timer.js" defer></script>
        <script>
            let goober = document.getElementById("checkAnswer");
            let otherThing = document.getElementById("thing");
            function checkAnswer( text)
            {
                let cText = text.toLowerCase()
                let check = parseInt(localStorage.getItem("color"));
                switch(check) //just realized I could've just used an array...well, we're here now!
                {
                    case 0:
                        if(cText == "green")
                        {
                            let track = parseInt(localStorage.getItem("gameState"));
                            localStorage.setItem("gameState", track + 1)
                            return true;

                        }

                        break;
                    case 1:
                        if(cText == "orange")
                        {
                            let track = parseInt(localStorage.getItem("gameState"));
                        localStorage.setItem("gameState", track + 1)
                            return true;

                        }

                        break;
                    case 2:
                        if(cText == "red")
                        {
                            let track = parseInt(localStorage.getItem("gameState"));
                        localStorage.setItem("gameState", track + 1)
                            return true;
                        }

                        break;
                    default:
                        return false;
                        break;
                }
            }
            goober.addEventListener("click", function()
            {
                let textBox = document.getElementById("textBox");
                let answer = textBox.value;
                if(checkAnswer(answer))
                {
                    otherThing.innerText = "See? Easy"
                }
                else
                {
                    otherThing.innerHTML = "That expression doesn't <strong>complement</strong> your face."
                }
            });
        </script>
